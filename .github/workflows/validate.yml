name: Validate extension

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    # Keep this image version aligned with the exact Playwright dependency.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install
      - run: npm audit --audit-level=high
      - run: npm test > unit-test.log 2>&1
      - name: Report unit test failure
        id: unit_report
        if: failure()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import os
          path = Path('unit-test.log')
          if path.exists():
              log = path.read_text()
              print(log)
              tail = log.split('failing tests:')[-1] if 'failing tests:' in log else log[-6000:]
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('message=' + ' | '.join(tail.splitlines())[-3000:] + '\n')
          PYCODE
      - name: "Unit test failure: ${{ steps.unit_report.outputs.message }}"
        if: failure() && steps.unit_report.outputs.message != ''
        run: exit 1
      - run: npm run package
      - name: Validate Firefox submission
        id: amo_lint
        run: |
          node --input-type=module <<'JSCODE'
          import { spawnSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const result = spawnSync('npm', ['exec', '--yes', '--package=web-ext@10.8.0', '--', 'web-ext', 'lint', '--source-dir', 'dist/firefox', '--output=json'], { encoding: 'utf8', maxBuffer: 16 * 1024 * 1024 });
          console.log(result.stdout);
          console.error(result.stderr);
          let summary;
          try {
            const report = JSON.parse(result.stdout);
            const compact = items => { const counts = new Map(); for (const x of items || []) { const key = x.code + ':' + (x.file || ''); counts.set(key, (counts.get(key) || 0) + 1); } return Object.fromEntries(counts); };
            summary = JSON.stringify({ errors: report.errors, warnings: compact(report.warnings), notices: compact(report.notices) }).slice(0, 3000);
          } catch { summary = (result.error?.message || result.stderr || 'No JSON lint report').slice(-3000); }
          appendFileSync(process.env.GITHUB_OUTPUT, 'summary=' + summary.replace(/[\r\n]/g, ' ') + '\n');
          process.exit(result.status ?? 1);
          JSCODE
      - name: "Firefox validation: ${{ steps.amo_lint.outputs.summary }}"
        if: always() && steps.amo_lint.outputs.summary != ''
        run: echo "Firefox validation details are recorded in the preceding step."
      - run: |
          runuser -u pwuser -- npm run test:popup > browser-test.log 2>&1
          runuser -u pwuser -- npm run test:browser >> browser-test.log 2>&1
      - name: Report browser failure
        id: browser_report
        if: failure()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import os
          path = Path('browser-test.log')
          if path.exists():
              log = path.read_text()[-16000:]
              escaped = log.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Browser smoke test::' + escaped)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('message=' + ' | '.join(log.splitlines()[-35:])[:3000] + '\n')
          PYCODE
      - name: "Browser failure: ${{ steps.browser_report.outputs.message }}"
        if: failure() && steps.browser_report.outputs.message != ''
        run: exit 1
