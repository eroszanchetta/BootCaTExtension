<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>BootCaT</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="popup.css"></head>
<body><main><div class="popup-brand"><img src="icons/icon-48.png" width="48" height="48" alt="BootCaT"></div><span class="badge">BOOTCAT LAB · 0.4</span><h1>Collect search results</h1>
<p id="page-info">Checking this tab…</p>
<button id="collect" disabled>Collect results from this tab</button>
<p id="feedback" role="status" aria-live="polite">Only results currently loaded on the page are collected.</p>
<button id="workspace" class="secondary">Open BootCaT workspace</button>
<p class="hint">Google · DuckDuckGo / Ecosia experimental. Review collected URLs in the workspace before downloading.</p>
</main><script type="module" src="popup.js"></script></body></html>
