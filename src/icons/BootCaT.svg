<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">BootCaT App Icon</title>
  <desc id="desc">Minimal macOS-style app icon with a blue cat silhouette and an orange boot shape.</desc>
  <defs>
    <linearGradient id="tileGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef5fb"/>
    </linearGradient>
    <linearGradient id="catGradient" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#66b9db"/>
      <stop offset="1" stop-color="#51a6cd"/>
    </linearGradient>
    <linearGradient id="bootGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc94f"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#2b5d78" flood-opacity="0.18"/>
    </filter>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#102033" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="196" fill="url(#tileGradient)" filter="url(#tileShadow)"/>
  <rect x="66" y="66" width="892" height="892" rx="194" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3"/>

  <g filter="url(#softShadow)">
    <!-- Cat silhouette -->
    <path fill="url(#catGradient)" d="
      M 525 185
      C 560 145, 604 113, 627 126
      C 650 139, 647 214, 628 265
      C 653 303, 651 348, 632 389
      C 746 421, 827 517, 845 642
      C 866 789, 767 893, 603 892
      C 468 891, 351 842, 297 754
      C 270 710, 254 650, 265 601
      C 272 570, 295 554, 319 563
      C 348 574, 353 610, 343 643
      C 330 688, 351 736, 392 758
      C 380 678, 379 582, 389 501
      C 366 456, 366 410, 388 366
      C 363 316, 360 265, 377 226
      C 393 190, 416 131, 443 126
      C 468 122, 506 158, 525 185
      Z"/>

    <!-- White separator around boot -->
    <path fill="#ffffff" d="
      M 420 502
      C 420 471, 445 446, 476 446
      L 555 446
      C 590 446, 617 473, 617 508
      L 617 600
      C 617 622, 634 639, 656 640
      L 705 642
      C 774 645, 821 686, 821 744
      C 821 806, 748 842, 629 842
      C 543 842, 468 829, 420 806
      L 420 502
      Z"/>

    <!-- Boot -->
    <path fill="url(#bootGradient)" d="
      M 456 514
      C 456 498, 469 485, 485 485
      L 548 485
      C 565 485, 578 498, 578 515
      L 578 604
      C 578 646, 609 677, 650 679
      L 700 681
      C 753 683, 782 711, 782 747
      C 782 789, 716 808, 630 808
      C 555 808, 493 799, 456 782
      L 456 514
      Z"/>
  </g>
</svg>
