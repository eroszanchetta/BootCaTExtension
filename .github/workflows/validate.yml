name: Validate extension

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run package
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser > browser-test.log 2>&1
      - name: Report browser failure
        id: browser_report
        if: failure()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import os
          path = Path('browser-test.log')
          if path.exists():
              log = path.read_text()[-16000:]
              escaped = log.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Browser smoke test::' + escaped)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('message=' + ' | '.join(log.splitlines()[-35:])[:3000] + '\n')
          PYCODE
      - name: "Browser failure: ${{ steps.browser_report.outputs.message }}"
        if: failure() && steps.browser_report.outputs.message != ''
        run: exit 1
