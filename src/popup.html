<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BootCaT</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="popup.css"></head>
<body><main><div class="popup-brand"><img src="icons/icon-48.png" width="48" height="48" alt="BootCaT"></div><span id="app-version" class="badge">BootCaT</span>
<button id="workspace" type="button">Open BootCaT</button>
<p class="hint">Open the main BootCaT window.</p>
<p id="popup-status" class="hint" role="status" aria-live="polite">Checking project and current tab…</p>
<div id="collect-action" class="popup-action" hidden>
<h3>Collect search results</h3>
<p id="page-info"></p>
<button id="collect" type="button" class="secondary" disabled>Collect results from this tab</button>
<p class="hint">Only results on the current page are collected.</p>
</div>
<p id="feedback" role="status" aria-live="polite" hidden></p>
<div id="capture-action" class="popup-action" hidden>
<h3>Save individual pages</h3>
<button id="save-page" type="button" class="secondary" disabled>Add page to corpus</button>
<p class="hint">Directly add the current page to your corpus, for example after completing a CAPTCHA.</p>
</div>
<p id="page-feedback" role="status" aria-live="polite" hidden></p>
</main><script type="module" src="popup.js"></script></body></html>
